<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Floating Offline — Raft Board</title>
  <style>
    :root {
      --bg: #071927;
      --card-bg: #0c2338;
      --accent: #0284c7;
      --accent-hover: #0369a1;
      --otter-amber: #d97706;
      --text: #f8fafc;
      --text-muted: #94a3b8;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    body {
      background-color: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1.5rem;
      text-align: center;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid rgba(56, 189, 248, 0.2);
      border-radius: 1.5rem;
      padding: 2.5rem 1.75rem;
      max-width: 420px;
      width: 100%;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .otter-icon {
      width: 96px;
      height: 96px;
      margin: 0 auto 1.5rem;
      background: linear-gradient(135deg, rgba(2, 132, 199, 0.3), rgba(56, 189, 248, 0.15));
      border: 2px solid rgba(56, 189, 248, 0.4);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 24px rgba(2, 132, 199, 0.3);
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.35rem 0.85rem;
      background: rgba(217, 119, 6, 0.15);
      border: 1px solid rgba(217, 119, 6, 0.4);
      color: #fbbf24;
      border-radius: 9999px;
      font-size: 0.8rem;
      font-weight: 600;
      margin-bottom: 1rem;
      letter-spacing: 0.025em;
    }
    .pulse-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #f59e0b;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }
    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      color: #ffffff;
      margin-bottom: 0.5rem;
    }
    p {
      color: var(--text-muted);
      font-size: 0.95rem;
      line-height: 1.5;
      margin-bottom: 1.75rem;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 0.85rem 1.5rem;
      background: var(--accent);
      color: #ffffff;
      font-weight: 600;
      font-size: 1rem;
      border-radius: 9999px;
      border: none;
      cursor: pointer;
      transition: background 0.15s ease, transform 0.1s ease;
      text-decoration: none;
    }
    .btn:hover {
      background: var(--accent-hover);
    }
    .btn:active {
      transform: scale(0.98);
    }
    .tagline {
      margin-top: 1.5rem;
      font-size: 0.75rem;
      color: #64748b;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="otter-icon">
      <!-- Friendly Otter SVG -->
      <svg width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2C8.5 2 6 4.5 6 8c0 2 .5 3.5 1.5 5L6 18c-.5 1.5.5 3 2 3h8c1.5 0 2.5-1.5 2-3l-1.5-5c1-1.5 1.5-3 1.5-5 0-3.5-2.5-6-6-6z"/>
        <circle cx="9.5" cy="8" r="1.2" fill="#38bdf8"/>
        <circle cx="14.5" cy="8" r="1.2" fill="#38bdf8"/>
        <path d="M11 11c.6.4 1.4.4 2 0"/>
        <path d="M4 14c1.5 1 3.5 1 5 0"/>
        <path d="M15 14c1.5 1 3.5 1 5 0"/>
      </svg>
    </div>

    <div class="status-badge">
      <span class="pulse-dot"></span>
      No Internet Connection
    </div>

    <h1>Floating Offline</h1>
    <p>You drifted away from the river bank! Don't worry, Raft Board will automatically reconnect as soon as your internet returns.</p>

    <button class="btn" onclick="window.location.reload()">
      Try Reconnecting
    </button>

    <div class="tagline">
      Otter Software Systems • Building software like no otter
    </div>
  </div>
</body>
</html>
